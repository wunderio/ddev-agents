# Prebuilds the agents devcontainer image for every PHP × Node combination
# that wunderio/silta-images provides, and pushes it to Docker Hub as
#   wunderio/ddev-agents-devcontainer:php<PHP>-node<NODE>-<HASH>
# where HASH comes from .devcontainer/scripts/image-tag.sh. The
# `ddev build-devcontainer` pre-start hook pulls the matching tag, or builds
# locally when no tag matches.
name: Devcontainer images

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-images.yml
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-images.yml
  # Weekly refresh: picks up new Claude Code / Copilot releases and apt
  # security updates, and new PHP / Node versions added to silta-images.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: wunderio/ddev-agents-devcontainer
  # Lowest Node major to prebuild; older silta-node variants are EOL.
  NODE_MIN: 20
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  matrix:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.versions.outputs.php }}
      node: ${{ steps.versions.outputs.node }}
      hash: ${{ steps.versions.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - name: Read PHP and Node versions from wunderio/silta-images
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/wunderio/silta-images/contents"
          list() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api/$1?ref=master"; }

          php=$(list silta-php-fpm | jq -c '
            [.[] | select(.type == "dir") | .name
             | select(test("^[0-9]+\\.[0-9]+-fpm$")) | sub("-fpm$"; "")]
            | sort_by(split(".") | map(tonumber))')
          node=$(list silta-node | jq -c --argjson min "$NODE_MIN" '
            [.[] | select(.type == "dir") | .name
             | select(test("^[0-9]+-alpine$")) | sub("-alpine$"; "") | tonumber
             | select(. >= $min)]
            | sort | map(tostring)')

          # Keep PR checks cheap: build one representative combination.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            php='["8.3"]'
            node='["22"]'
          fi

          if [ "$(jq length <<<"$php")" -eq 0 ] || [ "$(jq length <<<"$node")" -eq 0 ]; then
            echo "::error::Could not resolve versions (php=$php node=$node)"
            exit 1
          fi

          hash=$(bash .devcontainer/scripts/image-tag.sh .devcontainer)
          echo "PHP: $php  Node: $node  Hash: $hash"
          {
            echo "php=$php"
            echo "node=$node"
            echo "hash=$hash"
          } >> "$GITHUB_OUTPUT"

  build:
    name: php${{ matrix.php }}-node${{ matrix.node }} (${{ matrix.platform.arch }})
    needs: matrix
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
        node: ${{ fromJSON(needs.matrix.outputs.node) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      # Job-level env can't read the workflow `env` context, so the repo is repeated here.
      IMAGE: wunderio/ddev-agents-devcontainer:php${{ matrix.php }}-node${{ matrix.node }}-${{ needs.matrix.outputs.hash }}-${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      # Same placeholder rendering as commands/host/build-devcontainer.
      - name: Render build config
        run: |
          sed -e "s|__PHP_VERSION__|${{ matrix.php }}|g" \
              -e "s|__NODE_VERSION__|${{ matrix.node }}|g" \
              -e "s|__PROJECT_NAME__|prebuilt|g" \
              .devcontainer/devcontainer.build.json > .devcontainer/devcontainer.build.resolved.json

      - name: Build
        run: |
          devcontainer build \
            --workspace-folder . \
            --config .devcontainer/devcontainer.build.resolved.json \
            --image-name "$IMAGE"

      - name: Smoke test
        run: |
          docker run --rm -u vscode "$IMAGE" bash -c '
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            php -v && composer -V && node -v && gh --version && claude --version
            php_ver=$(php -r "echo PHP_MAJOR_VERSION.\".\".PHP_MINOR_VERSION;")
            node_ver=$(node -p "process.versions.node.split(\".\")[0]")
            [ "$php_ver" = "${{ matrix.php }}" ] || { echo "PHP $php_ver != ${{ matrix.php }}"; exit 1; }
            [ "$node_ver" = "${{ matrix.node }}" ] || { echo "Node $node_ver != ${{ matrix.node }}"; exit 1; }
          '

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push
        if: env.PUSH == 'true'
        run: docker push "$IMAGE"

  manifest:
    name: Manifest php${{ matrix.php }}-node${{ matrix.node }}
    needs: [matrix, build]
    # Run even if some combinations failed, so the working ones still publish.
    if: always() && needs.matrix.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
        node: ${{ fromJSON(needs.matrix.outputs.node) }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch tags
        run: |
          set -euo pipefail
          base="php${{ matrix.php }}-node${{ matrix.node }}"
          tag="$IMAGE_REPO:$base-${{ needs.matrix.outputs.hash }}"
          for arch in amd64 arm64; do
            if ! docker buildx imagetools inspect "$tag-$arch" > /dev/null; then
              echo "::error::Missing $tag-$arch — the $arch build failed or was not pushed"
              exit 1
            fi
          done
          docker buildx imagetools create \
            -t "$tag" \
            -t "$IMAGE_REPO:$base" \
            "$tag-amd64" "$tag-arm64"
          echo "Published $tag"
