name: ddev-agents
version: 1.0.0
description: "Standardized AI Agent environment for Wunder.io projects."

# All project_files must contain a #ddev-generated marker so that
# "ddev addon get" can overwrite them on updates. Without it, DDEV
# treats the file as user-customized and skips it.
# Exception: docker-compose.agents-volumes.yaml deliberately has no marker so
# it is installed once and then left alone (it holds per-project overlays).
project_files:
  - docker-compose.agents.yaml
  - docker-compose.agents-env.yaml
  - docker-compose.agents-volumes.yaml
  - config.agents.yaml
  - .devcontainer/devcontainer.json
  - .devcontainer/devcontainer.build.json
  - .devcontainer/features/claude/devcontainer-feature.json
  - .devcontainer/features/claude/install.sh
  - .devcontainer/features/browser-deps/devcontainer-feature.json
  - .devcontainer/features/browser-deps/install.sh
  - commands/host/claude
  - commands/host/copilot
  - commands/host/build-devcontainer
  - commands/host/set-up
  - commands/host/agents-worktree-prune
  - scripts/claude-bootstrap.sh
  - scripts/agents-worktree.sh
  - claude-managed-settings.json
  - claude-managed-instructions.md
  - copilot-managed-config.json
  - .agents
  - web-build
post_install_actions:
  - rm -rf ../.devcontainer
  - mv .devcontainer ..
  - mkdir -p ../.agents
  - cp -a .agents/. ../.agents/
  - rm -rf .agents
  - '[ -f web-build/Dockerfile ] && grep -q "#ddev-generated" web-build/Dockerfile && rm web-build/Dockerfile || true' # Deprecate in 2.0
  - echo "🚀 DDEV Agents installed."
  - echo "👉 Run 'ddev restart' to build the Agents container."
  - echo "👉 Then reopen VS Code in the Container."
  - echo "👉 Or run 'ddev claude' to use Claude Code from the CLI."
  - echo "👉 Or run 'ddev copilot' from the CLI."
  - echo "👉 Edit .ddev/docker-compose.agents-env.yaml to forward web_environment variables to the agents container."
  - echo "👉 Parallel agents, one Drupal environment per git worktree: ddev add-on get fourkitchens/ddev-fire-worktrees (see .agents/WORKTREES.md)."
  - echo "👉 macOS host freezing during agent runs (endpoint-security/EDR)? See .ddev/docker-compose.agents-volumes.yaml."
