#ddev-generated
services:
  agents:
    container_name: ddev-${DDEV_PROJECT}-agents
    build:
      dockerfile_inline: |
        FROM mcr.microsoft.com/devcontainers/python:3-bookworm
        USER root
        RUN apt-get update && apt-get install -y --no-install-recommends \
              apt-transport-https lsb-release ca-certificates curl \
          && curl -fsSL https://packages.sury.org/php/apt.gpg \
               -o /usr/share/keyrings/deb.sury.org-php.gpg \
          && echo "deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] \
               https://packages.sury.org/php/ $$(lsb_release -sc) main" \
               > /etc/apt/sources.list.d/sury-php.list \
          && apt-get update \
          && apt-get install -y --no-install-recommends \
               php8.4-cli php8.4-curl php8.4-xml php8.4-mbstring \
               php8.4-mysql php8.4-zip php8.4-tokenizer \
               unzip build-essential file procps jq default-mysql-client \
          && rm -rf /var/lib/apt/lists/*
        RUN curl -fsSL https://getcomposer.org/installer | \
              php -- --install-dir=/usr/local/bin --filename=composer
        RUN YQ_ARCH=$$(dpkg --print-architecture) && \
              curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_$${YQ_ARCH}" \
              -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
        USER vscode
        SHELL ["/bin/bash", "-c"]
        ENV NVM_DIR=/home/vscode/.nvm
        RUN curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
        RUN source $$NVM_DIR/nvm.sh \
          && nvm install --lts \
          && nvm alias default node \
          && mkdir -p /home/vscode/.local/bin \
          && ln -sf $$(which node) /home/vscode/.local/bin/node \
          && ln -sf $$(which npm) /home/vscode/.local/bin/npm \
          && ln -sf $$(which npx) /home/vscode/.local/bin/npx
    pull_policy: build
    hostname: agents
    user: vscode
    restart: "no"
    # Security hardening: Drop all Linux capabilities. The container runs as
    # non-root (vscode), so capabilities are already inert for the running
    # process. This additionally restricts the bounding set, preventing even
    # root (via docker exec -u root) from acquiring capabilities.
    # No cap_add needed — outbound networking, file I/O, and user-level
    # package installs (pip, npm) all work without any capabilities.
    cap_drop:
      - ALL
    # Security hardening: Prevent privilege escalation via setuid/setgid
    # binaries. This intentionally disables sudo inside the container,
    # closing the passwordless-sudo path in the base devcontainer image.
    # Root access is still available from the host via:
    #   docker exec -u root -it <container> bash
    # Devcontainer feature installation is unaffected (runs during image
    # build, not in the running container).
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../:/workspace:cached
      - ddev-global-cache:/mnt/ddev-global-cache
      - claude-state:/home/vscode/.claude-state
      - ./claude-managed-settings.json:/etc/claude-code/managed-settings.json:ro
    working_dir: /workspace
    environment:
      - DDEV_PROJECT=${DDEV_PROJECT}
      - ANTHROPIC_API_KEY=
    command: ["sleep", "infinity"]
    labels:
      com.ddev.site-name: ${DDEV_PROJECT}
      com.ddev.app-type: agents

volumes:
  claude-state:
    name: ddev-agents-claude-state